[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "edfarray"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]
license = "MIT"
description = "A Rust-backed EDF/EDF+ file parser with numpy-like Python bindings"
readme = "README.md"

[tool.maturin]
manifest-path = "crates/edfarray-python/Cargo.toml"
module-name = "edfarray._core"
python-source = "."
python-packages = ["edfarray"]
include = ["edfarray/_core/*.pyi", "edfarray/aio/*.pyi", "edfarray/py.typed", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=7",
    "maturin>=1.0",
    "mkdocs-material>=9.7.5",
    "pytest-asyncio>=0.23",
]
# pyedflib builds from source and needs the Python development headers. It is only
# used by the benchmarks and by scripts/generate_references.py, so it stays out of
# the default sync.
bench = ["pyedflib>=0.1.42"]
