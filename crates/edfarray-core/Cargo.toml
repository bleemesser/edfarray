[package]
name = "edfarray-core"
version = "1.1.0"
edition = "2024"
description = "EDF/EDF+/BDF file parsing with memory-mapped and streaming reads"
license = "MIT"
readme = "../../README.md"
documentation = "https://bleemesser.github.io/edfarray/"
keywords = ["edf", "bdf", "eeg", "biosignal", "parser"]
categories = ["parser-implementations", "science::neuroscience"]

[dependencies]
chrono = { version = "0.4", default-features = false }
hmac = "0.13.0"
log = { version = "0.4.29", default-features = false }
memmap2 = { version = "0.9.10", default-features = false }
rayon = "1.11.0"
regex = "1.12.3"
sha2 = "0.11.0"
thiserror = { version = "2.0.18", default-features = false }

[target.'cfg(unix)'.dependencies]
# Only used for madvise/mincore/sysconf, all of which are unix-only.
libc = "0.2.183"

[dev-dependencies]
proptest = "1.10.0"
tempfile = "3.27.0"
