[package]
name = "edfarray"
version = "1.0.1"
edition = "2024"
description = "Python bindings for edfarray, an EDF/EDF+/BDF parser with numpy-like access"
license = "MIT"
readme = "../../README.md"
documentation = "https://bleemesser.github.io/edfarray/"

[lib]
name = "edfarray"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
chrono = { version = "0.4.44", default-features = false }
edfarray-core = { path = "../edfarray-core" }
numpy = "0.28.0"
pyo3 = { version = "0.28.2" }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }
pyo3-stub-gen = { version = "0.19.0", default-features = false, features = ["numpy"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "macros"] }
